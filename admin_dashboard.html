<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cravings - Admin Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#E6C387', 500: '#D4AF37', 600: '#AA820A' },
                        cardDark: '#1A1613',
                        bgDark: '#120F0D'
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #120F0D; }
        ::-webkit-scrollbar-thumb { background: #3A322C; border-radius: 4px; }
        .tab-active { border-bottom: 2px solid #D4AF37; color: #D4AF37; }
        .tab-inactive { color: #9ca3af; }
    </style>
</head>
<body class="bg-bgDark text-stone-200 font-sans min-h-screen flex antialiased">

    <aside class="w-64 bg-[#171310] border-r border-gold-500/20 flex flex-col hidden md:flex">
        <div class="p-6 border-b border-gold-500/10 flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-gold-600 to-amber-200 p-0.5 shadow-lg">
                <div class="w-full h-full bg-[#120F0D] rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-utensils text-gold-400 text-sm"></i>
                </div>
            </div>
            <div>
                <h1 class="font-serif text-lg font-bold text-amber-100">CRAVINGS</h1>
                <p class="text-[10px] text-gold-400 uppercase tracking-widest">Admin Portal</p>
            </div>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('orders')" id="nav-orders" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-gold-500/10 text-gold-400 font-medium transition">
                <i class="fa-solid fa-bell"></i>
                <span>Live Orders</span>
            </button>
            <button onclick="switchTab('menu')" id="nav-menu" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-white/5 text-stone-400 hover:text-white font-medium transition">
                <i class="fa-solid fa-book-open"></i>
                <span>Menu Management</span>
            </button>
        </nav>
        
        <div class="p-4 border-t border-gold-500/10">
            <div id="connectionStatus" class="flex items-center space-x-2 text-xs text-amber-500 bg-amber-500/10 p-2 rounded-lg border border-amber-500/20">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Demo Mode (Connect Supabase)</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="h-20 border-b border-gold-500/10 bg-[#171310]/50 backdrop-blur flex items-center justify-between px-8">
            <h2 id="pageTitle" class="text-xl font-serif font-bold text-white">Live Orders</h2>
            <div class="flex items-center space-x-4 text-sm">
                <span id="currentTime" class="text-stone-400 font-mono"></span>
                <div class="w-8 h-8 bg-gold-500 rounded-full flex items-center justify-center text-stone-900 font-bold">
                    A
                </div>
            </div>
        </header>

        <!-- Content Views -->
        <div class="flex-1 overflow-y-auto p-8">
            
            <div id="view-orders" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-medium text-stone-300">Recent Orders</h3>
                    <button onclick="fetchOrders()" class="px-4 py-2 bg-cardDark border border-gold-500/30 rounded-lg text-xs hover:border-gold-400 transition flex items-center space-x-2">
                        <i class="fa-solid fa-rotate-right text-gold-400"></i>
                        <span>Refresh</span>
                    </button>
                </div>
                
                <div id="ordersList" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Orders injected via JS -->
                </div>
            </div>

            <div id="view-menu" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-medium text-stone-300">Menu Items</h3>
                    <button onclick="openMenuModal()" class="px-4 py-2 bg-gold-500 text-stone-900 font-bold rounded-lg text-xs hover:bg-gold-400 transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add New Item</span>
                    </button>
                </div>

                <div class="bg-cardDark rounded-2xl border border-gold-500/20 overflow-hidden">
                    <table class="w-full text-left text-sm text-stone-300">
                        <thead class="bg-[#120F0D] text-xs uppercase text-stone-400 border-b border-gold-500/20">
                            <tr>
                                <th class="px-6 py-4">Item</th>
                                <th class="px-6 py-4">Category</th>
                                <th class="px-6 py-4">Price (ETB)</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="menuTableBody" class="divide-y divide-gold-500/10">
                            <!-- Menu items injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div id="menuModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cardDark border border-gold-500/30 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <h3 class="font-serif text-xl font-bold text-white mb-4">Add Menu Item</h3>
            
            <form id="menuForm" onsubmit="handleMenuSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-stone-400 mb-1">Title</label>
                    <input type="text" id="itemTitle" required class="w-full bg-[#120F0D] border border-gold-500/30 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-gold-400">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-stone-400 mb-1">Category</label>
                        <select id="itemCategory" class="w-full bg-[#120F0D] border border-gold-500/30 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-gold-400">
                            <option value="burgers">Gourmet Burgers</option>
                            <option value="ethiopian">Ethiopian Specialties</option>
                            <option value="mains">Main Courses</option>
                            <option value="pizzas-pastas">Pizza & Pasta</option>
                            <option value="beverages">Beverages</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-stone-400 mb-1">Price (ETB)</label>
                        <input type="number" id="itemPrice" required class="w-full bg-[#120F0D] border border-gold-500/30 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-gold-400">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-stone-400 mb-1">Description</label>
                    <textarea id="itemDesc" rows="3" class="w-full bg-[#120F0D] border border-gold-500/30 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-gold-400"></textarea>
                </div>
                
                <div>
                    <label class="block text-xs text-stone-400 mb-1">Image URL</label>
                    <input type="url" id="itemImage" placeholder="https://..." class="w-full bg-[#120F0D] border border-gold-500/30 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-gold-400">
                </div>

                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeMenuModal()" class="flex-1 py-2.5 bg-stone-800 text-white font-bold text-sm rounded-xl hover:bg-stone-700 transition">Cancel</button>
                    <button type="submit" class="flex-1 py-2.5 bg-gold-500 text-stone-900 font-bold text-sm rounded-xl hover:bg-gold-400 transition">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SUPABASE CONFIGURATION
        // Replace these with your actual Supabase details
        // ==========================================
        const SUPABASE_URL = '[https://lvzheadbckxoighronjg.supabase.co]';
        const SUPABASE_ANON_KEY = 'sb_publishable_pGpTnMD9Z4a5y81hrEY5sQ_xr9Mpwtw';
        
        let supabase = null;
        let isDemoMode = SUPABASE_URL.includes('YOUR_');

        if (!isDemoMode) {
            supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            document.getElementById('connectionStatus').innerHTML = `
                <i class="fa-solid fa-circle-check text-emerald-400"></i>
                <span class="text-emerald-400">Connected to Database</span>
            `;
            document.getElementById('connectionStatus').className = 'flex items-center space-x-2 text-xs bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20';
        }

        // ==========================================
        // 2. STATE & DEMO DATA
        // ==========================================
        let currentTab = 'orders';
        
        let demoOrders = [
            { id: '1', table_number: 'Table 3', status: 'pending', total_etb: 3850, created_at: new Date().toISOString(), items: [{title: 'Berbere Burger', qty: 1}, {title: 'Crave Beef Tibs', qty: 1}] },
            { id: '2', table_number: 'Takeaway', status: 'preparing', total_etb: 1985, created_at: new Date(Date.now() - 900000).toISOString(), items: [{title: 'Pomodoro Beef Tibs Pasta', qty: 1}] }
        ];

        let demoMenu = [
            { id: 'm1', title: 'Berbere Burger', category_slug: 'burgers', price_etb: 1750, is_available: true },
            { id: 'm2', title: 'Crave Beef Tibs', category_slug: 'ethiopian', price_etb: 2100, is_available: true },
            { id: 'm3', title: 'Pomodoro Beef Tibs Pasta', category_slug: 'pizzas-pastas', price_etb: 1985, is_available: false }
        ];

        // ==========================================
        // 3. UI & INITIALIZATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            fetchOrders();
            fetchMenu();
        });

        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update Nav UI
            document.getElementById('nav-orders').className = `w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${tab === 'orders' ? 'bg-gold-500/10 text-gold-400 font-medium' : 'hover:bg-white/5 text-stone-400 hover:text-white font-medium'}`;
            document.getElementById('nav-menu').className = `w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${tab === 'menu' ? 'bg-gold-500/10 text-gold-400 font-medium' : 'hover:bg-white/5 text-stone-400 hover:text-white font-medium'}`;
            
            // Update Headers & Views
            document.getElementById('pageTitle').textContent = tab === 'orders' ? 'Live Orders' : 'Menu Management';
            document.getElementById('view-orders').classList.toggle('hidden', tab !== 'orders');
            document.getElementById('view-menu').classList.toggle('hidden', tab !== 'menu');
        }

        // ==========================================
        // 4. ORDERS LOGIC
        // ==========================================
        async function fetchOrders() {
            let ordersToRender = [];
            
            if (isDemoMode) {
                ordersToRender = demoOrders;
            } else {
                try {
                    // Supabase Query: Fetch orders and their nested items
                    const { data, error } = await supabase
                        .from('orders')
                        .select(`
                            id, table_number, status, total_etb, created_at,
                            order_items ( title:menu_item_title, quantity, notes )
                        `)
                        .order('created_at', { ascending: false });
                        
                    if (error) throw error;
                    // Map order_items to 'items' to match rendering logic
                    ordersToRender = data.map(order => ({
                        ...order,
                        items: order.order_items
                    }));
                } catch (error) {
                    console.error('Error fetching orders:', error);
                    alert('Could not load orders from Supabase.');
                    return;
                }
            }

            renderOrders(ordersToRender);
        }

        function renderOrders(orders) {
            const list = document.getElementById('ordersList');
            if (orders.length === 0) {
                list.innerHTML = `<div class="col-span-full text-center py-12 text-stone-500">No active orders found.</div>`;
                return;
            }

            list.innerHTML = orders.map(order => {
                const timeStr = new Date(order.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const statusColors = {
                    'pending': 'bg-red-500/20 text-red-400 border-red-500/30',
                    'preparing': 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                    'completed': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
                };
                
                const itemsList = (order.items || []).map(item => 
                    `<div class="flex justify-between text-xs text-stone-300">
                        <span>${item.qty || item.quantity}x ${item.title}</span>
                    </div>`
                ).join('');

                return `
                <div class="bg-cardDark border border-gold-500/20 rounded-2xl p-5 shadow-xl flex flex-col">
                    <div class="flex justify-between items-start mb-4 border-b border-gold-500/10 pb-3">
                        <div>
                            <h4 class="font-bold text-white text-lg">${order.table_number}</h4>
                            <span class="text-[10px] text-stone-400">${timeStr}</span>
                        </div>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border uppercase tracking-wider ${statusColors[order.status]}">${order.status}</span>
                    </div>
                    
                    <div class="space-y-2 mb-4 flex-1">
                        ${itemsList}
                    </div>

                    <div class="pt-3 border-t border-gold-500/10 flex justify-between items-center mt-auto">
                        <span class="font-bold text-gold-400">${Number(order.total_etb).toLocaleString()} ETB</span>
                        
                        <div class="flex space-x-2">
                            ${order.status === 'pending' ? `<button onclick="updateOrderStatus('${order.id}', 'preparing')" class="px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-stone-900 rounded-lg text-xs font-bold transition">Accept</button>` : ''}
                            ${order.status === 'preparing' ? `<button onclick="updateOrderStatus('${order.id}', 'completed')" class="px-3 py-1.5 bg-emerald-500/20 hover:bg-emerald-500 text-emerald-400 hover:text-stone-900 rounded-lg text-xs font-bold transition">Complete</button>` : ''}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function updateOrderStatus(orderId, newStatus) {
            if (isDemoMode) {
                const order = demoOrders.find(o => o.id === orderId);
                if (order) order.status = newStatus;
                fetchOrders();
                return;
            }

            try {
                const { error } = await supabase
                    .from('orders')
                    .update({ status: newStatus })
                    .eq('id', orderId);
                
                if (error) throw error;
                fetchOrders();
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        // ==========================================
        // 5. MENU MANAGEMENT LOGIC
        // ==========================================
        async function fetchMenu() {
            let menuToRender = [];
            
            if (isDemoMode) {
                menuToRender = demoMenu;
            } else {
                try {
                    const { data, error } = await supabase
                        .from('menu_items')
                        .select('*')
                        .order('created_at', { ascending: false });
                        
                    if (error) throw error;
                    menuToRender = data;
                } catch (error) {
                    console.error('Error fetching menu:', error);
                    return;
                }
            }

            renderMenuTable(menuToRender);
        }

        function renderMenuTable(items) {
            const tbody = document.getElementById('menuTableBody');
            tbody.innerHTML = items.map(item => `
                <tr class="hover:bg-[#1C1713] transition">
                    <td class="px-6 py-4 font-medium text-white">${item.title}</td>
                    <td class="px-6 py-4 text-stone-400 capitalize">${(item.category_slug || 'misc').replace('-', ' ')}</td>
                    <td class="px-6 py-4 text-gold-400 font-mono">${item.price_etb} ETB</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-[10px] font-bold ${item.is_available ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">
                            ${item.is_available ? 'Available' : 'Sold Out'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="toggleAvailability('${item.id}', ${!item.is_available})" class="text-stone-400 hover:text-white mx-2" title="Toggle Availability">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                        <button onclick="deleteMenuItem('${item.id}')" class="text-red-400/70 hover:text-red-400 mx-2" title="Delete">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function openMenuModal() {
            document.getElementById('menuForm').reset();
            document.getElementById('menuModal').classList.remove('hidden');
        }

        function closeMenuModal() {
            document.getElementById('menuModal').classList.add('hidden');
        }

        async function handleMenuSubmit(e) {
            e.preventDefault();
            const newItem = {
                title: document.getElementById('itemTitle').value,
                category_slug: document.getElementById('itemCategory').value,
                price_etb: parseFloat(document.getElementById('itemPrice').value),
                description: document.getElementById('itemDesc').value,
                image_url: document.getElementById('itemImage').value || null,
                is_available: true
            };

            if (isDemoMode) {
                newItem.id = 'demo-' + Date.now();
                demoMenu.unshift(newItem);
                closeMenuModal();
                fetchMenu();
                return;
            }

            try {
                const { error } = await supabase.from('menu_items').insert([newItem]);
                if (error) throw error;
                closeMenuModal();
                fetchMenu();
            } catch (error) {
                console.error('Error adding item:', error);
                alert('Failed to add item.');
            }
        }

        async function toggleAvailability(id, is_available) {
            if (isDemoMode) {
                const item = demoMenu.find(i => i.id === id);
                if (item) item.is_available = is_available;
                fetchMenu();
                return;
            }

            try {
                const { error } = await supabase.from('menu_items').update({ is_available }).eq('id', id);
                if (error) throw error;
                fetchMenu();
            } catch (error) {
                console.error('Error toggling availability:', error);
            }
        }

        async function deleteMenuItem(id) {
            // Replaced default browser confirm with a simple custom UI approach if needed, 
            // but for simplicity in demo environments we'll just execute it.
            if (isDemoMode) {
                demoMenu = demoMenu.filter(i => i.id !== id);
                fetchMenu();
                return;
            }

            try {
                const { error } = await supabase.from('menu_items').delete().eq('id', id);
                if (error) throw error;
                fetchMenu();
            } catch (error) {
                console.error('Error deleting item:', error);
            }
        }
    </script>
</body>
</html>
